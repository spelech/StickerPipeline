[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sticker-pipeline"
version = "1.0.0"
description = "Automated sticker generation, background removal, contour offset, and printable sheet generator for Cricut Joy 2 and Epson EcoTank printers."
readme = "README.md"
authors = [{ name = "Antigravity Pipeline" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "rembg>=2.0.50",
    "onnxruntime>=1.15.0",
    "opencv-python-headless>=4.8.0",
    "pillow>=10.0.0",
    "reportlab>=4.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "python-multipart>=0.0.6"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "flake8>=6.1.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
